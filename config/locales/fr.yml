                type d'adhésion et pondérés par les poids d'adhésion définis dans la
                configuration de la gouvernance d'entreprise.</p> <p>Chaque option de
                réponse affiche le nombre de votes qu'elle a reçus de chaque type d'adhésion
                mais aucun poids n'est appliqué dans cette vue.</p> <p>Par exemple,
                si l'option A a reçu 2 votes de membres avec un poids de « 3.0 » et
                1 vote d'un membre avec un poids de « 1.0 », les résultats afficheront
                2 votes de membres avec un poids de « 3.0 » et 1 vote de membres avec
                un poids de « 1.0 ».</p> <p>⚠️ Ces résultats ne sont pas affichés au
                public.</p>
              normal_count_html: "<p>Ces résultats sont calculés en comptant chaque
                vote de manière égale, quel que soit le poids d'adhésion du participant
                qui l'a émis.</p> <p>⚠️ Ces résultats ne sont pas affichés au public.</p>"
              sum_of_weights_html: <p>Les résultats ci-dessous sont pondérés par les
                poids d'adhésion définis dans la configuration de la gouvernance d'entreprise.</p>
                <p>Chaque vote est multiplié par le poids du membre qui l'a émis.</p>
                <p>Par exemple, si un membre avec un poids de « 3.0 » vote pour l'option
                A et qu'un membre avec un poids de « 1.0 » vote pour l'option B, les
                résultats afficheront 3 votes pour l'option A et 1 vote pour l'option
                B.</p> <p><strong>⚠️ Ce sont ces résultats qui sont affichés au public.</strong></p>
              title: Comment interpréter ces résultats ?
              totals_html: "<p>Les résultats ci-dessous affichent les totaux pour chaque
                question, en sommant tous les votes reçus par chaque option de réponse
                en appliquant les poids d'adhésion et sans les appliquer.</p> <p>Vous
                pouvez également voir le nombre de participants et combien de votes
                délégués ont été émis pour chaque option.</p> <p>⚠️ Ces résultats ne
                sont pas affichés au public.</p>"
